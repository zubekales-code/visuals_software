<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; media-src 'self' file: blob:; img-src 'self' file: data:; style-src 'self' 'unsafe-inline' file:; font-src 'self' file:">
<title>VJ pult</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo">VJ</div>
    <div class="brand-txt"><span class="proj">Pracovní sada</span><span class="sub">uloženo automaticky · v0.2</span></div>
  </div>

  <div class="seg tempo">
    <span class="lbl">BPM</span>
    <span class="bpm mono" id="bpm">122.0</span>
    <button id="tap" class="btn sm" title="Ťukni do rytmu (4×)">TAP</button>
    <div class="beats" id="beats"><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="seg meters" id="topMeters"></div>

  <div class="seg perf mono">
    <span><span class="accent" id="fps">—</span> fps</span>
    <span class="muted" id="gpuMs">GPU — ms</span>
    <span class="muted" id="gpuName">—</span>
  </div>

  <div class="spacer"></div>

  <button class="btn ghost testbtn" id="testBtn" title="Test výkonu (Etapa 0)">Test výkonu<span class="badge" id="errBadge" hidden>!</span></button>
  <button class="proj-status" id="projBtn" title="Výstup a projektor"><span class="dot" id="projDot"></span><span id="projTxt">Projektor · —</span></button>
  <button class="btn lock" id="lock" title="Zámek: myš nic nezmění, klávesy fungují (Ctrl+L)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    ZÁMEK
  </button>
  <button class="black" id="black" title="Nouzová černá (Esc)">ČERNÁ · Esc</button>
</header>

<section class="gridwrap" aria-label="Mřížka klipů">
  <div class="cliprow head" id="colHead"></div>
  <div id="rows"></div>
</section>

<section class="bottom">
  <div class="card preview">
    <div class="card-head">
      <span class="title">Náhled výstupu</span><span class="muted sm">zmenšený</span>
      <div class="spacer"></div>
      <label class="muted sm glowlbl"><input type="checkbox" id="glowOn"> Glow celku</label>
      <input type="range" class="slim w90" id="glowAmt" min="0" max="1" step="0.01">
    </div>
    <div class="screen">
      <canvas id="preview" width="640" height="360"></canvas>
      <span class="screen-lbl mono" id="screenLbl">VÝSTUP</span>
    </div>
  </div>

  <div class="card props" id="props"></div>

  <div class="card audio">
    <div class="card-head"><span class="title">Zvuk</span><span class="muted sm" id="audioDev">—</span></div>
    <div id="bands"></div>
    <span class="muted sm">tečka = úder v pásmu</span>
    <div class="divider"></div>
    <div class="prow3"><span class="plabel">Citlivost</span><input type="range" class="slim" id="sens" min="0.3" max="2" step="0.05"><span class="val mono" id="sensVal"></span></div>
    <div class="srcbtns">
      <button class="btn" data-src="input">Kabel</button>
      <button class="btn" data-src="wav">Wav soubor</button>
      <button class="btn" data-src="demo">Demo</button>
    </div>
    <div class="srcrow" id="inRow"><select id="device"></select><button class="btn sm" id="loadDevices">Načíst vstupy</button></div>
    <div class="srcrow" id="wavRow"><button class="btn sm" id="pickWav">Vybrat…</button><span class="muted sm ell" id="wavName">—</span><button class="btn sm" id="playWav" title="Mezerník">▶ / ❚❚</button></div>
  </div>
</section>

<div class="menu" id="menu" hidden></div>
<script src="control.js"></script>
</body>
</html>
